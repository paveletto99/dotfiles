#:schema https://developers.openai.com/codex/config-schema.json
model = "gpt-6.1-sol"

# Approve for me: automatically review requests that need approval.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = ":workspace"
web_search = "live"

model_reasoning_effort = "high"
model_verbosity = "low"
service_tier = "default"

[features]
analytics_plan_history = true
enable_request_compression = true
# Use Guardian v2 with the runtime's current reviewer model and policy.
guardian_approval = true
guardianv2 = true
memories = true
prevent_idle_sleep = true

[features.context_management]
experimental_mode = true


[projects."/Users/pobo/workspace"]
trust_level = "trusted"

[tui]
theme = "orng"
notifications = ["agent-turn-complete", "approval-requested"]
show_tooltips = false
status_line = ["model-with-reasoning", "context-remaining", "git-branch", "current-dir", "project-name", "pull-request-number", "branch-changes", "run-state", "approval-mode", "five-hour-limit", "codex-version", "task-progress"]
terminal_title = ["spinner", "project", "git-branch"]

[tui.keymap.global]
open_transcript = "ctrl-t"

[tui.keymap.composer]
submit = "enter"

[tui.keymap.editor]
insert_newline = "shift-enter"

[tui.keymap.chat]
interrupt_turn = "f12"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."google-drive@openai-curated-remote"]
enabled = true

[plugins."expedia@openai-curated-remote"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = true

# macOS browser bridge uses the service shipped with the installed ChatGPT app.
[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

# Mirrored from .config/opencode/opencode.jsonc.
[mcp_servers."chrome-devtools"]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
enabled = false

# The work-only cf-portal and google-workspace servers are injected by
# .codex/bin/codex whenever that launcher selects the Cloudflare AI Gateway.
[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

